<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d">
  <title id="t">Corral Light: four AI assistants on one wall, behind one fence</title>
  <desc id="d">A browser window holding four panes (Claude, ChatGPT, Grok, Gemini). Claude works on its own git branch, Codex reviews it, Grok is stopped at the gate asking to run a command with Approve and Refuse buttons, and Gemini answers a question. A ranch fence runs along the bottom.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a241d"/>
      <stop offset="1" stop-color="#15120f"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2620"/>
      <stop offset="1" stop-color="#211d18"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .ui { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
      .h { font-size: 15px; font-weight: 600; fill: #efe6d8; }
      .sub { font-size: 12px; fill: #a99d8c; }
      .tiny { font-size: 11px; fill: #a99d8c; }
      .line { fill: #4a4238; }
      .line2 { fill: #3a342c; }
    </style>
  </defs>

  <!-- sky and ground -->
  <rect width="1200" height="660" fill="url(#sky)"/>
  <circle cx="1040" cy="92" r="46" fill="#d5813f" opacity="0.18"/>
  <circle cx="1040" cy="92" r="28" fill="#d5813f" opacity="0.35"/>
  <rect y="590" width="1200" height="70" fill="#14110e"/>

  <!-- the wall: a browser window -->
  <g filter="url(#shadow)">
    <rect x="110" y="44" width="980" height="520" rx="16" fill="url(#win)" stroke="#3b342b"/>
  </g>
  <rect x="110" y="44" width="980" height="40" rx="16" fill="#302a23"/>
  <rect x="110" y="68" width="980" height="16" fill="#302a23"/>
  <circle cx="138" cy="64" r="6" fill="#d5813f"/>
  <circle cx="158" cy="64" r="6" fill="#c9a24a"/>
  <circle cx="178" cy="64" r="6" fill="#8fae6d"/>
  <rect x="380" y="53" width="440" height="22" rx="11" fill="#1d1a16"/>
  <text x="600" y="68" text-anchor="middle" class="ui tiny">127.0.0.1:8098 · on your machine</text>

  <!-- sidebar -->
  <rect x="122" y="96" width="150" height="456" rx="10" fill="#1d1a16"/>
  <rect x="134" y="110" width="126" height="28" rx="8" fill="#d5813f"/>
  <text x="197" y="129" text-anchor="middle" class="ui" font-size="12" font-weight="600" fill="#1d1a16">＋ New conversation</text>
  <text x="138" y="164" class="ui tiny">CONVERSATIONS</text>
  <g class="ui" font-size="12">
    <circle cx="142" cy="186" r="4" fill="#8fae6d"/><text x="154" y="190" fill="#efe6d8">@author · Claude</text>
    <circle cx="142" cy="210" r="4" fill="#8fae6d"/><text x="154" y="214" fill="#efe6d8">@reviewer · Codex</text>
    <circle cx="142" cy="234" r="4" fill="#d5813f"/><text x="154" y="238" fill="#efe6d8">Grok</text>
    <text x="196" y="238" fill="#d5813f" font-weight="600">needs you</text>
    <circle cx="142" cy="258" r="4" fill="#8fae6d"/><text x="154" y="262" fill="#efe6d8">Gemini</text>
  </g>
  <rect x="134" y="498" width="126" height="24" rx="7" fill="#2b2620"/>
  <text x="197" y="514" text-anchor="middle" class="ui tiny">Search  ⌘K</text>

  <!-- pane 1: Claude on its own branch -->
  <rect x="286" y="96" width="390" height="222" rx="10" fill="#1d1a16" stroke="#3b342b"/>
  <text x="302" y="122" class="ui h">Claude</text>
  <text x="362" y="122" class="ui sub">@author</text>
  <rect x="302" y="134" width="236" height="22" rx="11" fill="#26301f" stroke="#8fae6d"/>
  <g stroke="#8fae6d" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="316" cy="141" r="2.5"/><circle cx="316" cy="151" r="2.5"/><circle cx="326" cy="143" r="2.5"/>
    <path d="M316 143.5v5M318 141c6 0 8 0 8 2"/>
  </g>
  <text x="334" y="149" class="ui" font-size="12" fill="#cfe0bd">fix-login · 4 files +120 −8</text>
  <rect x="302" y="172" width="340" height="9" rx="4.5" class="line"/>
  <rect x="302" y="190" width="300" height="9" rx="4.5" class="line2"/>
  <rect x="302" y="208" width="322" height="9" rx="4.5" class="line2"/>
  <rect x="302" y="232" width="358" height="66" rx="8" fill="#15120f"/>
  <text x="314" y="252" class="mono" font-size="11" fill="#8fae6d">+ def verify_token(raw):</text>
  <text x="314" y="268" class="mono" font-size="11" fill="#8fae6d">+     return hmac.compare_digest(</text>
  <text x="314" y="284" class="mono" font-size="11" fill="#c0756f">-     return raw == SECRET</text>

  <!-- pane 2: Codex reviewing -->
  <rect x="690" y="96" width="388" height="222" rx="10" fill="#1d1a16" stroke="#3b342b"/>
  <text x="706" y="122" class="ui h">ChatGPT</text>
  <text x="776" y="122" class="ui sub">@reviewer · Codex</text>
  <rect x="706" y="136" width="356" height="46" rx="8" fill="#2b2620"/>
  <text x="718" y="155" class="ui" font-size="12" fill="#d5813f">message from @author</text>
  <text x="718" y="172" class="ui" font-size="12" fill="#efe6d8">"Login fix is on corral/fix-login. Review?"</text>
  <rect x="706" y="196" width="320" height="9" rx="4.5" class="line"/>
  <rect x="706" y="214" width="344" height="9" rx="4.5" class="line2"/>
  <rect x="706" y="232" width="270" height="9" rx="4.5" class="line2"/>
  <rect x="706" y="256" width="356" height="44" rx="8" fill="#15120f"/>
  <text x="718" y="275" class="ui" font-size="12" fill="#efe6d8">Looks right. One test missing for an</text>
  <text x="718" y="291" class="ui" font-size="12" fill="#efe6d8">empty token; sending it to @author.</text>

  <!-- seat message arrow -->
  <path d="M676 150 C 684 150, 684 150, 690 150" stroke="#d5813f" stroke-width="2.5" fill="none"/>
  <path d="M684 145 l7 5 -7 5" stroke="#d5813f" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

  <!-- pane 3: Grok at the gate -->
  <rect x="286" y="330" width="390" height="222" rx="10" fill="#1d1a16" stroke="#d5813f" stroke-width="2"/>
  <text x="302" y="356" class="ui h">Grok</text>
  <rect x="350" y="342" width="76" height="20" rx="10" fill="#d5813f"/>
  <text x="388" y="356" text-anchor="middle" class="ui" font-size="11" font-weight="700" fill="#1d1a16">NEEDS YOU</text>
  <rect x="302" y="372" width="358" height="164" rx="10" fill="#2a2119" stroke="#5a3f27"/>
  <text x="316" y="394" class="ui" font-size="13" font-weight="600" fill="#efe6d8">Run a command?</text>
  <rect x="316" y="404" width="330" height="30" rx="6" fill="#15120f"/>
  <text x="328" y="424" class="mono" font-size="12" fill="#efe6d8">$ pytest -q tests/test_login.py</text>
  <text x="316" y="452" class="mono" font-size="11" fill="#a99d8c">31 bytes · sha256 3f9a07c2e1b8…</text>
  <rect x="316" y="470" width="132" height="34" rx="8" fill="#8fae6d"/>
  <text x="382" y="492" text-anchor="middle" class="ui" font-size="13" font-weight="700" fill="#1d1a16">Approve</text>
  <rect x="458" y="470" width="110" height="34" rx="8" fill="none" stroke="#a99d8c"/>
  <text x="513" y="492" text-anchor="middle" class="ui" font-size="13" fill="#efe6d8">Refuse</text>
  <text x="316" y="524" class="ui tiny">Nothing runs until you choose.</text>

  <!-- pane 4: Gemini answering -->
  <rect x="690" y="330" width="388" height="222" rx="10" fill="#1d1a16" stroke="#3b342b"/>
  <text x="706" y="356" class="ui h">Gemini</text>
  <text x="768" y="356" class="ui sub">Antigravity</text>
  <rect x="826" y="370" width="236" height="34" rx="10" fill="#d5813f" opacity="0.9"/>
  <text x="944" y="392" text-anchor="middle" class="ui" font-size="12" fill="#1d1a16">Which token format is safer?</text>
  <rect x="706" y="418" width="330" height="9" rx="4.5" class="line"/>
  <rect x="706" y="436" width="300" height="9" rx="4.5" class="line2"/>
  <rect x="706" y="454" width="342" height="9" rx="4.5" class="line2"/>
  <rect x="706" y="472" width="250" height="9" rx="4.5" class="line2"/>
  <text x="706" y="530" class="ui tiny">⌘↵ asked all four at once · ⇄ lets them compare answers</text>

  <!-- the fence: three rails, two posts per bay -->
  <g stroke-linecap="round">
    <g stroke="#d5813f" stroke-width="9">
      <path d="M20 600 H1180"/>
      <path d="M20 624 H1180"/>
      <path d="M20 648 H1180"/>
    </g>
    <g stroke="#8fae6d" stroke-width="11">
      <path d="M60 580 V660"/><path d="M330 580 V660"/><path d="M600 580 V660"/>
      <path d="M870 580 V660"/><path d="M1140 580 V660"/>
    </g>
  </g>
</svg>
