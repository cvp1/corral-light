# A Corral rig: the seats you work with, brought back with one verb.
#
#   rig save <name>   writes rigs/<name>.toml from the seated panes on the roster
#   rig up <name>     validates this whole file, then resumes or starts each seat
#
# `rig up` starts nothing if any check fails (parse error, version, seat name,
# agent, key, cwd, pane cap, duplicate seat, unresolved role, seat already live).
#
# `prompt` (optional, hand-written) is sent as your first turn when a seat starts
# fresh, never on resume. A `role`'s instructions are sent ahead of it.

version = 1

[[seat]]
id      = "author"
agent   = "claude"
cwd     = "~/src/example"
posture = "edits"
prompt  = "Read the open issue list and propose the smallest next change."

[[seat]]
id      = "reviewer"
agent   = "codex"
cwd     = "~/src/example"
