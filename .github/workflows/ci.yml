name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The main suite split four ways by measured class duration
  # (tests/ci_shard.py), each shard on its own runner.
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # a shard takes ~3 min; a hang fails fast
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Vendor ACP adapters
        run: npm ci --prefix spike
      - name: Main suite, one shard
        run: python3 tests/ci_shard.py run ${{ matrix.shard }} ${{ strategy.job-total }}
      - name: Core suite
        if: matrix.shard == 1
        run: python3 -m unittest discover -s corral_core -t . -p 'test_*.py'
      - name: Container suite
        if: matrix.shard == 1
        run: python3 -m unittest discover -s tests/container -p 'test_*.py'

  # The required check: green only when every shard passed.
  test:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.shard.result }}" = success

  # The module sandbox on macOS (Seatbelt; docs/finops-macos-sandbox.md §6).
  # It must be available here: the sandboxed tests skip without it, so the
  # first step fails the job instead of letting them pass by skipping.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["system", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - if: matrix.python != 'system'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Pick the interpreter
        run: |
          if [ "${{ matrix.python }}" = system ]; then echo "PY=/usr/bin/python3" >> "$GITHUB_ENV"
          else echo "PY=$(command -v python3)" >> "$GITHUB_ENV"; fi
      - name: The sandbox is available
        run: |
          "$PY" -B -c "import sys, module_sandbox as m; ok, why = m.available(); print(sys.version.split()[0], ok, why); sys.exit(0 if ok else 1)"
      - name: Module, fetcher and update tests
        run: |
          "$PY" -B -m unittest -v test_modules test_module_fetch test_update

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
